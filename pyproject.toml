[project]
name = "python-summer-boot"
version = "1.0.7"
description = "After spring it comes the summer."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Ton Llucia", email = "tonlls1999@gmail.com" },
    { name = "Joan Travé", email = "jtravegordillo@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pydantic~=1.10.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest~=7.2.0",
    "pytest-cov~=4.0.0",
    "pytest-mock~=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summer"]
